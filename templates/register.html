{% extends "base.html" %}

{% block title %}Sign Up - Resume Optimizer{% endblock %}

{% block content %}
<style>
    /* Hide default base canvas */
    #bg-canvas {
        display: none !important;
    }
    /* Custom 3D canvas for register page */
    #register-bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        pointer-events: none;
    }
    .auth-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        position: relative;
        z-index: 1;
    }
    .auth-card {
        background: rgba(255,255,255,0.95);
        backdrop-filter: blur(12px);
        border-radius: 2rem;
        padding: 2rem;
        width: 450px;
        max-width: 90%;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.3);
        transition: transform 0.3s;
    }
    .auth-card:hover {
        transform: translateY(-5px);
    }
    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    .auth-icon {
        font-size: 3rem;
        background: linear-gradient(135deg, #f59e0b, #ea580c);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 1rem;
    }
    .auth-header h2 {
        color: #1e293b;
        font-size: 1.8rem;
        margin-bottom: 0.25rem;
    }
    .auth-header p {
        color: #64748b;
    }
    .auth-form .form-group {
        margin-bottom: 1.5rem;
    }
    .auth-form label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: #1e293b;
    }
    .auth-form label i {
        margin-right: 0.5rem;
        color: #f59e0b;
    }
    .form-control {
        width: 100%;
        padding: 0.75rem;
        border: 2px solid #e2e8f0;
        border-radius: 1rem;
        font-size: 1rem;
        transition: 0.2s;
        background: rgba(255,255,255,0.8);
    }
    .form-control:focus {
        outline: none;
        border-color: #f59e0b;
        box-shadow: 0 0 0 3px rgba(245,158,11,0.2);
    }
    .form-help {
        display: block;
        margin-top: 0.25rem;
        font-size: 0.7rem;
        color: #64748b;
    }
    .btn-block {
        width: 100%;
        justify-content: center;
        background: linear-gradient(135deg, #f59e0b, #ea580c);
        border: none;
        padding: 0.75rem;
        border-radius: 1rem;
        font-weight: 600;
        color: white;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.2s;
    }
    .btn-block:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(245,158,11,0.3);
    }
    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid #e2e8f0;
    }
    .auth-footer p {
        margin-bottom: 0.5rem;
        color: #64748b;
    }
    .auth-footer a {
        color: #f59e0b;
        text-decoration: none;
        font-weight: 500;
    }
    .auth-footer a:hover {
        text-decoration: underline;
    }
    @media (max-width: 480px) {
        .auth-card { padding: 1.5rem; }
        .auth-header h2 { font-size: 1.5rem; }
    }
</style>

<canvas id="register-bg-canvas"></canvas>
<script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('register-bg-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);

    // Golden torus knot particles
    const particlesCount = 2200;
    const positions = new Float32Array(particlesCount * 3);
    const colors = new Float32Array(particlesCount * 3);

    for (let i = 0; i < particlesCount; i++) {
        const t = (i / particlesCount) * Math.PI * 2;
        const radius = 3.5;
        const tube = 0.9;
        const p = 3;
        const q = 7;
        const x = radius * (1 + tube * Math.cos(q * t)) * Math.cos(p * t);
        const y = radius * (1 + tube * Math.cos(q * t)) * Math.sin(p * t);
        const z = radius * tube * Math.sin(q * t);
        positions[i*3] = x * 2.2;
        positions[i*3+1] = y * 2.2;
        positions[i*3+2] = z * 2.2;

        // Color: gold to orange gradient
        const hue = 0.10 + (i / particlesCount) * 0.1; // 0.10→0.20 (gold→orange)
        const saturation = 0.9;
        const lightness = 0.65;
        const color = new THREE.Color().setHSL(hue, saturation, lightness);
        colors[i*3] = color.r;
        colors[i*3+1] = color.g;
        colors[i*3+2] = color.b;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const material = new THREE.PointsMaterial({ size: 0.09, vertexColors: true, transparent: true, opacity: 0.9 });
    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    // Floating tiny gold stars
    const starCount = 1200;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        starPositions[i*3] = (Math.random() - 0.5) * 50;
        starPositions[i*3+1] = (Math.random() - 0.5) * 30;
        starPositions[i*3+2] = (Math.random() - 0.5) * 40 - 20;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffaa66, size: 0.07 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    camera.position.z = 20;

    function animate() {
        requestAnimationFrame(animate);
        particles.rotation.y += 0.002;
        particles.rotation.x += 0.001;
        stars.rotation.y -= 0.0005;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-plus auth-icon"></i>
            <h2>Create Account</h2>
            <p>Join thousands of successful job seekers</p>
        </div>

        <form method="post" class="auth-form">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" name="username" class="form-control" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" class="form-control" placeholder="Minimum 8 characters" required>
                <small class="form-help">Password must be at least 8 characters</small>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Confirm Password</label>
                <input type="password" name="confirm" class="form-control" placeholder="Confirm your password" required>
            </div>

            <div class="form-options">
                <label class="checkbox">
                    <input type="checkbox" required> I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </label>
            </div>

            <button type="submit" class="btn-block">Create Free Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
