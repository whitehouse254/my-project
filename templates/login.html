{% extends "base.html" %}

{% block title %}Sign In - Resume Optimizer{% endblock %}

{% block content %}
<style>
    /* Hide default base canvas */
    #bg-canvas {
        display: none !important;
    }
    /* Custom 3D canvas for login page */
    #login-bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        pointer-events: none;
    }
    .auth-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        position: relative;
        z-index: 1;
    }
    .auth-card {
        background: rgba(255,255,255,0.95);
        backdrop-filter: blur(12px);
        border-radius: 2rem;
        padding: 2rem;
        width: 450px;
        max-width: 90%;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.3);
        transition: transform 0.3s;
    }
    .auth-card:hover {
        transform: translateY(-5px);
    }
    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    .auth-icon {
        font-size: 3rem;
        background: linear-gradient(135deg, #ef4444, #f97316);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 1rem;
    }
    .auth-header h2 {
        color: #1e293b;
        font-size: 1.8rem;
        margin-bottom: 0.25rem;
    }
    .auth-header p {
        color: #64748b;
    }
    .auth-form .form-group {
        margin-bottom: 1.5rem;
    }
    .auth-form label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: #1e293b;
    }
    .auth-form label i {
        margin-right: 0.5rem;
        color: #f97316;
    }
    .form-control {
        width: 100%;
        padding: 0.75rem;
        border: 2px solid #e2e8f0;
        border-radius: 1rem;
        font-size: 1rem;
        transition: 0.2s;
        background: rgba(255,255,255,0.8);
    }
    .form-control:focus {
        outline: none;
        border-color: #f97316;
        box-shadow: 0 0 0 3px rgba(249,115,22,0.2);
    }
    .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        font-size: 0.85rem;
    }
    .checkbox {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
    }
    .forgot-password {
        color: #f97316;
        text-decoration: none;
    }
    .forgot-password:hover {
        text-decoration: underline;
    }
    .btn-block {
        width: 100%;
        justify-content: center;
        background: linear-gradient(135deg, #ef4444, #f97316);
        border: none;
        padding: 0.75rem;
        border-radius: 1rem;
        font-weight: 600;
        color: white;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.2s;
    }
    .btn-block:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(239,68,68,0.3);
    }
    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid #e2e8f0;
    }
    .auth-footer p {
        margin-bottom: 0.5rem;
        color: #64748b;
    }
    .auth-footer a {
        color: #f97316;
        text-decoration: none;
        font-weight: 500;
    }
    .auth-footer a:hover {
        text-decoration: underline;
    }
    .guest-link a {
        color: #64748b;
        font-size: 0.85rem;
    }
    @media (max-width: 480px) {
        .auth-card { padding: 1.5rem; }
        .auth-header h2 { font-size: 1.5rem; }
    }
</style>

<canvas id="login-bg-canvas"></canvas>
<script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('login-bg-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);

    // Warm fire particles (orange, red, gold)
    const particlesCount = 1800;
    const positions = new Float32Array(particlesCount * 3);
    const colors = new Float32Array(particlesCount * 3);

    for (let i = 0; i < particlesCount; i++) {
        // Torus knot shape
        const t = (i / particlesCount) * Math.PI * 2;
        const radius = 3.2;
        const tube = 0.85;
        const p = 3;
        const q = 8;
        const x = radius * (1 + tube * Math.cos(q * t)) * Math.cos(p * t);
        const y = radius * (1 + tube * Math.cos(q * t)) * Math.sin(p * t);
        const z = radius * tube * Math.sin(q * t);
        positions[i*3] = x * 2.2;
        positions[i*3+1] = y * 2.2;
        positions[i*3+2] = z * 2.2;

        // Color from red to gold
        const hue = 0.05 + (i / particlesCount) * 0.1; // 0.05→0.15 (red→orange)
        const saturation = 0.9;
        const lightness = 0.65;
        const color = new THREE.Color().setHSL(hue, saturation, lightness);
        colors[i*3] = color.r;
        colors[i*3+1] = color.g;
        colors[i*3+2] = color.b;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const material = new THREE.PointsMaterial({ size: 0.08, vertexColors: true, transparent: true, opacity: 0.9 });
    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    // Floating glowing orbs
    const orbCount = 400;
    const orbPositions = new Float32Array(orbCount * 3);
    for (let i = 0; i < orbCount; i++) {
        orbPositions[i*3] = (Math.random() - 0.5) * 25;
        orbPositions[i*3+1] = (Math.random() - 0.5) * 15;
        orbPositions[i*3+2] = (Math.random() - 0.5) * 20 - 15;
    }
    const orbGeo = new THREE.BufferGeometry();
    orbGeo.setAttribute('position', new THREE.BufferAttribute(orbPositions, 3));
    const orbMat = new THREE.PointsMaterial({ color: 0xff8844, size: 0.07 });
    const orbs = new THREE.Points(orbGeo, orbMat);
    scene.add(orbs);

    camera.position.z = 20;

    function animate() {
        requestAnimationFrame(animate);
        particles.rotation.y += 0.002;
        particles.rotation.x += 0.001;
        orbs.rotation.y -= 0.0005;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-bullseye auth-icon"></i>
            <h2>Welcome Back!</h2>
            <p>Sign in to continue your job search</p>
        </div>

        <form method="post" class="auth-form">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div class="form-options">
                <label class="checkbox">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-block">Sign In</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('register') }}">Sign Up</a></p>
            <p class="guest-link"><a href="{{ url_for('jobs') }}">← Browse jobs as guest</a></p>
        </div>
    </div>
</div>
{% endblock %}
